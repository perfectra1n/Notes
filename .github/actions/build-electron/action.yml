inputs:
  os:
    description: "One of the supported platforms: macos, linux, windows"
    required: true
  arch:
    description: "The architecture to build for: x64, arm64"
    required: true
  extension:
    description: "Platform specific extensions to copy in the output: dmg, deb, rpm, exe, zip"
    required: true
runs:
  using: composite
  steps:
    # Set up certificates for macOS app and installer signing
    - name: Install the Apple certificates
      if: inputs.os == 'macos'
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ env.APPLE_APP_CERTIFICATE_BASE64 }}
        p12-password: ${{ env.APPLE_APP_CERTIFICATE_PASSWORD }}
        keychain: build
        keychain-password: ${{ github.run_id }}

    - name: Install the Apple installer certificate
      if: inputs.os == 'macos'
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ env.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
        p12-password: ${{ env.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        keychain: build
        keychain-password: ${{ github.run_id }}
        create-keychain: false

    - name: Set up Python and other macOS dependencies
      if: ${{ inputs.os == 'macos' }}
      shell: bash
      run: |
        brew install python-setuptools
        brew install create-dmg

    - name: Install dependencies for RPM and Flatpak package building
      if: ${{ inputs.os == 'linux' }}
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install rpm flatpak-builder elfutils
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        FLATPAK_ARCH=$(if [[ ${{ inputs.arch }} = 'arm64' ]]; then echo 'aarch64'; else echo 'x86_64'; fi)
        FLATPAK_VERSION='24.08'
        flatpak install --user --no-deps --arch $FLATPAK_ARCH --assumeyes runtime/org.freedesktop.Platform/$FLATPAK_ARCH/$FLATPAK_VERSION runtime/org.freedesktop.Sdk/$FLATPAK_ARCH/$FLATPAK_VERSION org.electronjs.Electron2.BaseApp/$FLATPAK_ARCH/$FLATPAK_VERSION

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Update build info
      shell: bash
      run: npm run chore:update-build-info

    - name: Run electron-forge build
      shell: bash
      env:
        APPLE_ID: ${{ env.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ env.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        DEBUG: 'electron-osx-sign*,@electron/notarize*,electron-forge:*'
        ELECTRON_NOTARIZE_DEBUG: 1
        ELECTRON_BUILDER_VERBOSE: true
      run: |
        echo "Starting build with debugging..."
        echo "Environment check (redacted):"
        echo "APPLE_ID set: $([[ -n "$APPLE_ID" ]] && echo 'yes' || echo 'no')"
        echo "APPLE_ID_PASSWORD set: $([[ -n "$APPLE_ID_PASSWORD" ]] && echo 'yes' || echo 'no')"
        echo "APPLE_TEAM_ID set: $([[ -n "$APPLE_TEAM_ID" ]] && echo 'yes' || echo 'no')"

        # Run the build
        npm run electron-forge:make -- --arch=${{ inputs.arch }} 2>&1 | tee build.log
        BUILD_STATUS=${PIPESTATUS[0]}
        
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "Build failed. Last 50 lines of output:"
          tail -n 50 build.log
          exit $BUILD_STATUS
        fi

        if [ ! -d "out/make" ]; then
          echo "Build directory not found!"
          exit 1
        fi

        echo "Build completed. Contents of out/make:"
        ls -la out/make/

    # Handle notarization and stapling for macOS
    - name: Install notarization dependencies
      if: inputs.os == 'macos'
      shell: bash
      run: npm install --save-dev @electron/notarize

    - name: Notarize and staple macOS artifacts
      if: inputs.os == 'macos'
      shell: bash
      env:
        APPLE_ID: ${{ env.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ env.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
      run: |
        # Find the artifacts
        APP_PATH=$(find out/make -name "*.app" -print -quit)
        DMG_PATH=$(find out/make -name "*.dmg" -print -quit)
        
        if [ -d "$APP_PATH" ]; then
          echo "Notarizing app bundle..."
          node -e "
            const { notarize } = require('@electron/notarize');
            
            async function notarizeApp() {
              try {
                await notarize({
                  appPath: '$APP_PATH',
                  appBundleId: 'com.triliumnext.notes',
                  appleId: process.env.APPLE_ID,
                  appleIdPassword: process.env.APPLE_ID_PASSWORD,
                  teamId: process.env.APPLE_TEAM_ID
                });
                console.log('App notarization complete!');
              } catch (error) {
                console.error('Notarization failed:', error);
                process.exit(1);
              }
            }
            
            notarizeApp();
          "
          
          # Staple the app
          echo "Stapling app bundle..."
          xcrun stapler staple "$APP_PATH"
        fi
        
        if [ -f "$DMG_PATH" ]; then
          echo "Notarizing DMG..."
          node -e "
            const { notarize } = require('@electron/notarize');
            
            async function notarizeDMG() {
              try {
                await notarize({
                  appPath: '$DMG_PATH',
                  appBundleId: 'com.triliumnext.notes',
                  appleId: process.env.APPLE_ID,
                  appleIdPassword: process.env.APPLE_ID_PASSWORD,
                  teamId: process.env.APPLE_TEAM_ID
                });
                console.log('DMG notarization complete!');
              } catch (error) {
                console.error('Notarization failed:', error);
                process.exit(1);
              }
            }
            
            notarizeDMG();
          "
          
          # Staple the DMG
          echo "Stapling DMG..."
          xcrun stapler staple "$DMG_PATH"
        fi

    - name: Verify code signing
      if: inputs.os == 'macos'
      shell: bash
      run: |
        echo "Listing build output directory:"
        ls -la out/make/

        APP_PATH=$(find out/make -name "*.app" -print -quit)
        DMG_PATH=$(find out/make -name "*.dmg" -print -quit)

        echo "Found app at: $APP_PATH"
        echo "Found DMG at: $DMG_PATH"

        if [ -d "$APP_PATH" ]; then
          echo "Checking app bundle signing..."
          codesign -dvv "$APP_PATH"
          echo "Detailed app verification:"
          codesign -vv --deep --strict "$APP_PATH"
          echo "Verifying app notarization:"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"
          
          # Also verify all components inside the app bundle
          echo "Verifying app bundle components:"
          find "$APP_PATH/Contents/MacOS" -type f -exec codesign -dvv {} \;
          find "$APP_PATH/Contents/Frameworks" -type f -exec codesign -dvv {} \;
        fi

        if [ -f "$DMG_PATH" ]; then
          echo "Checking DMG signing..."
          codesign -dvv "$DMG_PATH"
          echo "Verifying DMG notarization:"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH"
        fi

    - name: Prepare artifacts
      shell: bash
      run: |
        mkdir -p upload;
        for ext in ${{ inputs.extension }};
        do
          file=$(find out/make -name "*.$ext" -print -quit);
          cp "$file" "upload/TriliumNextNotes-${{ github.ref_name }}-${{ inputs.os }}-${{ inputs.arch }}.$ext";
        done
