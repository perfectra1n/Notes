inputs:
  os:
    description: "One of the supported platforms: macos, linux, windows"
    required: true
  arch:
    description: "The architecture to build for: x64, arm64"
    required: true
  extension:
    description: "Platform specific extensions to copy in the output: dmg, deb, rpm, exe, zip"
    required: true
runs:
  using: composite
  steps:
    # Set up certificates and keychain for macOS
    - name: Install Apple Certificates
      if: inputs.os == 'macos'
      shell: bash
      env:
        APP_CERTIFICATE_BASE64: ${{ env.APPLE_APP_CERTIFICATE_BASE64 }}
        APP_CERTIFICATE_PASSWORD: ${{ env.APPLE_APP_CERTIFICATE_PASSWORD }}
        INSTALLER_CERTIFICATE_BASE64: ${{ env.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
        INSTALLER_CERTIFICATE_PASSWORD: ${{ env.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ github.run_id }}
      run: |
        # Create keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain

        # Import application certificate
        echo "$APP_CERTIFICATE_BASE64" | base64 --decode > application.p12
        security import application.p12 -k build.keychain -P "$APP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        rm application.p12

        # Import installer certificate
        echo "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode > installer.p12
        security import installer.p12 -k build.keychain -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        rm installer.p12

        # Update keychain settings
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

        # Verify certificates
        echo "Verifying certificates..."
        security find-identity -v -p codesigning build.keychain

    - name: Set up Python for appdmg to be installed
      if: ${{ inputs.os == 'macos' }}
      shell: bash
      run: brew install python-setuptools
    - name: Install dependencies for RPM and Flatpak package building
      if: ${{ inputs.os == 'linux' }}
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install rpm flatpak-builder elfutils
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        FLATPAK_ARCH=$(if [[ ${{ inputs.arch }} = 'arm64' ]]; then echo 'aarch64'; else echo 'x86_64'; fi)
        FLATPAK_VERSION='24.08'
        flatpak install --user --no-deps --arch $FLATPAK_ARCH --assumeyes runtime/org.freedesktop.Platform/$FLATPAK_ARCH/$FLATPAK_VERSION runtime/org.freedesktop.Sdk/$FLATPAK_ARCH/$FLATPAK_VERSION org.electronjs.Electron2.BaseApp/$FLATPAK_ARCH/$FLATPAK_VERSION
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Update build info
      shell: bash
      run: npm run chore:update-build-info
    - name: Verify certificates before build
      if: inputs.os == 'macos'
      shell: bash
      run: |
        echo "Available signing identities:"
        security find-identity -v -p codesigning build.keychain

        echo "Certificate details:"
        security find-certificate -a -c "Developer ID Application" -p build.keychain | openssl x509 -text
    - name: Run electron-forge
      shell: bash
      env:
        APPLE_ID: ${{ env.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ env.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        DEBUG: 'electron-osx-sign*,@electron/notarize*,electron-forge:*'
        ELECTRON_NOTARIZE_DEBUG: 1
        ELECTRON_BUILDER_VERBOSE: true
      run: |
        echo "Starting build with debugging..."
        echo "Environment check (redacted):"
        echo "APPLE_ID set: $([[ -n "$APPLE_ID" ]] && echo 'yes' || echo 'no')"
        echo "APPLE_ID_PASSWORD set: $([[ -n "$APPLE_ID_PASSWORD" ]] && echo 'yes' || echo 'no')"
        echo "APPLE_TEAM_ID set: $([[ -n "$APPLE_TEAM_ID" ]] && echo 'yes' || echo 'no')"

        # Print working directory
        echo "Current working directory: $(pwd)"
        
        # Run the build with a timeout and save output
        timeout 45m npm run electron-forge:make -- --arch=${{ inputs.arch }} 2>&1 | tee build.log
        
        # Check if the build succeeded
        if [ ${PIPESTATUS[0]} -eq 124 ]; then
          echo "Build timed out after 45 minutes. Last 50 lines of output:"
          tail -n 50 build.log
          exit 1
        elif [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "Build failed. Last 50 lines of output:"
          tail -n 50 build.log
          exit ${PIPESTATUS[0]}
        fi
        
        # Check build output
        if [ -d "out/make" ]; then
          echo "Build completed. Contents of out/make:"
          ls -la out/make/
        else
          echo "Build directory not found!"
          exit 1
        fi

    # Add signing verification steps for macOS
    - name: Verify code signing
      if: inputs.os == 'macos'
      shell: bash
      run: |
        echo "Listing build output directory:"
        ls -la out/make/

        APP_PATH=$(find out/make -name "*.app" -print -quit)
        DMG_PATH=$(find out/make -name "*.dmg" -print -quit)

        echo "Found app at: $APP_PATH"
        echo "Found DMG at: $DMG_PATH"

        if [ -d "$APP_PATH" ]; then
          echo "Checking code signing for app bundle..."
          codesign -dvv "$APP_PATH" || true
          echo "Detailed verification:"
          codesign -vv --deep --strict "$APP_PATH" || true

          echo "Checking app bundle contents:"
          find "$APP_PATH" -type f -exec codesign -dvv {} \; 2>&1 || true
        fi

        if [ -f "$DMG_PATH" ]; then
          echo "Checking DMG signing..."
          codesign -dvv "$DMG_PATH" || true
        fi

    - name: Clean up keychain
      if: inputs.os == 'macos' && always()
      shell: bash
      run: security delete-keychain build.keychain
    - name: Prepare artifacts
      shell: bash
      run: |
        mkdir -p upload;
        for ext in ${{ inputs.extension }};
        do
          file=$(find out/make -name "*.$ext" -print -quit);
          cp "$file" "upload/TriliumNextNotes-${{ github.ref_name }}-${{ inputs.os }}-${{ inputs.arch }}.$ext";
        done
